<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Credit AI • Risk Detail</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bank: {
                            50: '#ecfeff', 100: '#cffafe', 200: '#a5f3fc', 300: '#67e8f9', 400: '#22d3ee',
                            500: '#06b6d4', 600: '#0891b2', 700: '#0e7490', 800: '#155e75', 900: '#164e63'
                        }
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="static/css/styles.css" />
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 [font-family:Inter,sans-serif]">
    <div class="pointer-events-none fixed inset-0 -z-10">
        <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900"></div>
        <div
            class="absolute inset-0 opacity-[0.08] bg-[radial-gradient(circle_at_1px_1px,#93c5fd_1px,transparent_1.2px)] [background-size:22px_22px]">
        </div>
        <div class="absolute -top-20 -left-20 h-72 w-72 rounded-full blur-3xl bg-cyan-600/20"></div>
        <div class="absolute -bottom-24 -right-20 h-80 w-80 rounded-full blur-3xl bg-blue-700/20"></div>
    </div>

    <nav th:fragment="nav" class="sticky top-0 z-30 border-b border-slate-800/80 bg-slate-900/70 backdrop-blur">
        <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div
                    class="h-9 w-9 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/30 grid place-items-center">
                    <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 7h16M6 11h12M8 15h8" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" />
                    </svg>
                </div>
                <div>
                    <div class="text-sm uppercase tracking-widest text-cyan-300/80">Credit AI</div>
                    <div class="text-base font-semibold">Risk Console</div>
                </div>
            </div>

            <div class="flex items-center gap-2 text-sm">
                <a href="/borrower"
                    class="px-3 py-2 rounded-md hover:bg-slate-800/70 border border-slate-800">Borrower</a>
                <a href="/risk" class="px-3 py-2 rounded-md hover:bg-slate-800/70 border border-slate-800">Risk
                    Console</a>
            </div>
        </div>
    </nav>

    <header class="mx-auto max-w-6xl px-4 pt-8">
        <div
            class="rounded-xl border border-slate-700/60 bg-slate-900/50 backdrop-blur p-4 md:p-6 shadow-xl shadow-black/20">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-start gap-3">
                    <span
                        class="inline-grid h-9 w-9 place-items-center rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 text-white shadow-md shadow-cyan-500/30">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
                            <path d="M3 12h4l3 7 4-14 3 7h4" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                    </span>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold tracking-tight">Risk — Application detail</h1>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs uppercase tracking-wider text-slate-400">Application ID</span>
                    <span
                        class="select-text inline-flex items-center gap-2 rounded-lg border border-slate-800 bg-slate-950 px-3 py-1 text-sm font-mono text-cyan-300">
                        <svg class="h-4 w-4 text-cyan-400" viewBox="0 0 24 24" fill="none">
                            <path d="M4 12l6 6L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <span id="appIdHdr">—</span>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8">
        <section
            class="rounded-xl border border-slate-800/60 bg-slate-900/50 backdrop-blur p-5 shadow-xl shadow-black/20">
            <div class="flex items-center justify-between gap-3 mb-3">
                <div class="flex items-center gap-2">
                    <span
                        class="inline-grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-bank-500 to-blue-600 text-white shadow-md shadow-cyan-500/30">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
                            <path d="M4 7h16M6 12h12M8 17h8" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                    </span>
                    <h2 class="text-lg font-semibold">Payload</h2>
                </div>

                <div class="flex items-center gap-2">
                    <button id="btnCopy"
                        class="hidden md:inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-white bg-slate-800 border border-slate-700 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-600">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
                            <path d="M8 7h8a2 2 0 0 1 2 2v8m-6 0H7a2 2 0 0 1-2-2V7m6 12 7-7" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" />
                        </svg>
                        Copy JSON
                    </button>
                </div>
            </div>

            <div class="relative">
                <div
                    class="pointer-events-none absolute -inset-[1px] rounded-xl bg-gradient-to-r from-cyan-600/20 via-blue-600/20 to-indigo-600/20">
                </div>
                <pre id="detail"
                    class="relative text-xs leading-relaxed rounded-xl border border-slate-800/80 bg-slate-950/80 p-4 text-cyan-200 overflow-auto max-h-[70vh]">Loading application data...</pre>
            </div>
        </section>
    </main>

    <footer class="mx-auto max-w-6xl px-4 pb-10 text-center text-xs text-slate-500">
        © <span class="tabular-nums">2025</span> Credit AI
    </footer>

    <script>
        const api = {
            async get(path) {
                const r = await fetch(path, { headers: { "Accept": "application/json" } });
                if (!r.ok) throw new Error(await r.text());
                return r.status === 204 ? null : r.json();
            },
            async post(path, body) {
                const r = await fetch(path, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify(body || {})
                });
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            }
        };
    </script>

    <script>
        const $ = s => document.querySelector(s);

        (async () => {
            const idRaw = new URLSearchParams(location.search).get("id");
            const id = (idRaw && idRaw !== "undefined" && idRaw !== "null") ? idRaw : null;

            if (!id) {
                $("#detail").textContent = "Missing or invalid ID.";
                return;
            }

            try {
                const data = await api.get(`/applications/${encodeURIComponent(id)}`);
                $("#detail").textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                let msg = e?.message || String(e);
                try {
                    const j = JSON.parse(msg);
                    msg = j?.message || j?.error || msg;
                } catch { }
                $("#detail").textContent = `Cannot load profile (${id}). ${msg}`;
            }
        })();
    </script>

    <script>
        const q = new URLSearchParams(location.search);
        const appIdHdrEl = document.getElementById("appIdHdr");
        if (appIdHdrEl) appIdHdrEl.textContent = q.get("id") || "—";

        const copyBtn = document.getElementById("btnCopy");
        copyBtn?.addEventListener("click", async () => {
            const content = document.getElementById("detail")?.textContent || "";
            try {
                await navigator.clipboard.writeText(content);
                copyBtn.classList.add("ring-2", "ring-cyan-500");
                copyBtn.innerHTML = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Copied!';
                setTimeout(() => {
                    copyBtn.classList.remove("ring-2", "ring-cyan-500");
                    copyBtn.innerHTML = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none"><path d="M8 7h8a2 2 0 0 1 2 2v8m-6 0H7a2 2 0 0 1-2-2V7m6 12 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Copy JSON';
                }, 1200);
            } catch { }
        });
    </script>

</body>

</html>
